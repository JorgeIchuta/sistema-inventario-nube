<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototipo navegable de Inventario Cloud">
  <title>Inventario Cloud — Prototipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="prototype-banner">PROTOTIPO VISUAL · Datos de demostración</div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">☁</div>
        <div><strong>Inventario</strong><span>Cloud</span></div>
      </div>
      <nav id="desktop-nav" class="nav-list"></nav>
      <div class="user-card">
        <div class="avatar">AU</div>
        <div><strong>Admin Usuario</strong><small>Administrador</small></div>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" aria-label="Abrir menú">☰</button>
        <div class="mobile-brand"><span class="brand-mark">☁</span><strong>Inventario Cloud</strong></div>
        <label class="global-search">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search" placeholder="Buscar productos..." aria-label="Buscar productos">
        </label>
        <div class="top-actions">
          <button class="icon-button notification" aria-label="Notificaciones">♢<i></i></button>
          <button class="avatar avatar-button" aria-label="Perfil de usuario">AU</button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
    </div>
  </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="Navegación móvil"></nav>
  <div class="scrim" id="scrim"></div>

  <dialog id="modal">
    <form method="dialog" class="modal-card" id="modal-form">
      <div class="modal-header">
        <div><p class="eyebrow">Inventario Cloud</p><h2 id="modal-title">Formulario</h2></div>
        <button class="icon-button" value="cancel" aria-label="Cerrar">×</button>
      </div>
      <div id="modal-content" class="form-grid"></div>
      <div class="modal-actions">
        <button class="button secondary" value="cancel">Cancelar</button>
        <button class="button primary" id="modal-submit" value="default">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
